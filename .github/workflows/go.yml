name: Go Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        check-latest: true
        cache: true

    - name: Format
      run: test -z "$(gofmt -l .)"

    - name: Vet
      run: go vet ./...

    # the maps are laid on a real world and board before they are written, as gram's own tests
    - name: Run Tests
      run: xvfb-run -a go test -v -race ./...
